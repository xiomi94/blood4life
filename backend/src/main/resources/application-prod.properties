spring.application.name=blood4life
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?allowPublicKeyRetrieval=true&useSSL=true&requireSSL=true&verifyServerCertificate=false
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.port=${PORT}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
application.security.jwt.secret-key=${JWT_SECRET_KEY}

# File Storage (Persistent Volume in Railway)
app.file-upload-dir=${FILE_UPLOAD_DIR:/app/uploads/}

# LDAP Configuration (Embedded LDAP Server for Admin Authentication)
spring.ldap.embedded.ldif=classpath:test-server.ldif
spring.ldap.embedded.base-dn=dc=blood4life,dc=com
spring.ldap.embedded.port=8389
spring.ldap.embedded.validation.enabled=false

# LDAP Connection
spring.ldap.urls=ldap://localhost:8389
spring.ldap.base=dc=blood4life,dc=com
